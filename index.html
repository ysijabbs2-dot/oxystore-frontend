<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXY PANNEL | Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { purple: { 500: '#a855f7', 600: '#9333ea', 900: '#581c87' }, electric: '#3b82f6' } } }
        }
    </script>
    <!-- React & Firebase -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB3OisQMTrOp_OTqEdVM3l1O_ojUNcky4E",
            authDomain: "oxy-pannel.firebaseapp.com",
            projectId: "oxy-pannel",
            storageBucket: "oxy-pannel.firebasestorage.app",
            messagingSenderId: "1051170940546",
            appId: "1:1051170940546:web:d2d438b07327441d94b69b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState({ balance: 0 });
            const [activeTab, setActiveTab] = useState('store');
            
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLoginView, setIsLoginView] = useState(true);

            const defaultProductData = { 
                videoUrl: "", 
                details: "OXY PANNEL Version.\nBest features and anti-ban protection.", 
                dur1: "3 Hours", price1: 147, keys1: [],
                dur2: "6 Hours", price2: 250, keys2: [],
                dur3: "1 Day", price3: 380, keys3: [],
                whatsappUrl: "https://wa.me/917250019052",
                telegramUrl: "https://t.me/Ts_hunter01",
                showWhatsapp: true,
                showTelegram: true
            };
            const [productData, setProductData] = useState(defaultProductData);
            const [userOrders, setUserOrders] = useState([]);
            const [allOrders, setAllOrders] = useState([]);
            const [recentInvoice, setRecentInvoice] = useState(null);

            const [newKey1, setNewKey1] = useState('');
            const [newKey2, setNewKey2] = useState('');
            const [newKey3, setNewKey3] = useState('');
            const [adminEmail, setAdminEmail] = useState('');
            const [addBalanceAmount, setAddBalanceAmount] = useState('');
            const [isAdminMode, setIsAdminMode] = useState(false);

            useEffect(() => {
                const unsubProduct = db.collection('settings').doc('product').onSnapshot(doc => {
                    if(doc.exists) setProductData({...defaultProductData, ...doc.data()});
                    else db.collection('settings').doc('product').set(defaultProductData);
                });

                const unsubAuth = auth.onAuthStateChanged(usr => {
                    setUser(usr);
                    if(usr) {
                        db.collection('users').doc(usr.uid).onSnapshot(doc => {
                            if(doc.exists) setUserData(doc.data());
                            else db.collection('users').doc(usr.uid).set({ email: usr.email, balance: 0 });
                        });

                        db.collection('orders').where('userId', '==', usr.uid).orderBy('date', 'desc').onSnapshot(snapshot => {
                            setUserOrders(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                        });
                    }
                });

                db.collection('orders').orderBy('date', 'desc').onSnapshot(snapshot => {
                    setAllOrders(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                return () => { unsubProduct(); unsubAuth(); };
            }, []);

            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    if (isLoginView) await auth.signInWithEmailAndPassword(email, password);
                    else await auth.createUserWithEmailAndPassword(email, password);
                    setEmail(''); setPassword('');
                } catch (error) {
                    alert(error.message);
                }
            };

            const handleBuy = async (duration, price, keyListKey) => {
                const stockList = productData[keyListKey] || [];
                if (stockList.length === 0) {
                    alert(`Sorry! ${duration} keys are currently out of stock.`);
                    return;
                }
                if (userData.balance < price) {
                    alert("Aapke wallet mein balance kam hai. Kripya Admin se contact karein.");
                    return;
                }

                if (confirm(`Confirm purchase of ${duration} Key for ₹${price}?`)) {
                    try {
                        const assignedKey = stockList[0];
                        const updatedStock = stockList.slice(1);

                        await db.collection('users').doc(user.uid).update({ balance: userData.balance - price });
                        await db.collection('settings').doc('product').update({ [keyListKey]: updatedStock });

                        const orderId = "OXY-" + Math.floor(100000 + Math.random() * 900000);
                        const orderData = {
                            orderId,
                            userId: user.uid,
                            userEmail: user.email,
                            duration,
                            price,
                            key: assignedKey,
                            date: new Date().toLocaleString()
                        };
                        await db.collection('orders').add(orderData);
                        setRecentInvoice(orderData);
                    } catch(err) {
                        alert("Error processing purchase: " + err.message);
                    }
                }
            };

            const adminUpdateBalance = async (e) => {
                e.preventDefault();
                try {
                    const usersRef = await db.collection('users').where('email', '==', adminEmail).get();
                    if(usersRef.empty) { alert("User not found!"); return; }
                    let targetUid = usersRef.docs[0].id;
                    let currentBal = usersRef.docs[0].data().balance || 0;
                    await db.collection('users').doc(targetUid).update({ balance: currentBal + parseInt(addBalanceAmount) });
                    alert(`Balance added successfully!`);
                    setAdminEmail(''); setAddBalanceAmount('');
                } catch(error) { alert("Error adding balance"); }
            };

            const adminSaveProduct = async (e) => {
                e.preventDefault();
                await db.collection('settings').doc('product').set(productData, { merge: true });
                alert("Product & Contact details updated live!");
            };

            const addKeysToStock = (keyField, inputVal, setInputVal) => {
                if(!inputVal.trim()) return;
                const newKeysArray = inputVal.split('\n').map(k => k.trim()).filter(k => k.length > 0);
                const currentKeys = productData[keyField] || [];
                const updated = [...currentKeys, ...newKeysArray];
                setProductData({...productData, [keyField]: updated});
                setInputVal('');
                alert(`${newKeysArray.length} keys added! Click 'Save Changes Live'.`);
            };

            if (!user) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4 relative overflow-hidden bg-[#0a0a0a]">
                        <div className="bg-gray-900 p-8 rounded-xl w-full max-w-md border border-purple-500/50 shadow-[0_0_30px_rgba(168,85,247,0.2)] z-10">
                            <h2 className="text-3xl font-black mb-2 text-center bg-gradient-to-r from-purple-500 to-electric text-transparent bg-clip-text">OXY PANNEL</h2>
                            <p className="text-center text-gray-400 mb-8">{isLoginView ? 'Login to your account' : 'Create a new account'}</p>
                            <form onSubmit={handleAuth} className="space-y-4">
                                <input type="email" required placeholder="Email Address" value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-3 bg-black border border-gray-700 rounded-lg focus:border-purple-500 outline-none" />
                                <input type="password" required placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3 bg-black border border-gray-700 rounded-lg focus:border-purple-500 outline-none" />
                                <button type="submit" className="w-full bg-gradient-to-r from-purple-600 to-electric py-3 rounded-lg font-bold">
                                    {isLoginView ? 'Log In' : 'Sign Up'}
                                </button>
                            </form>
                            <button onClick={() => setIsLoginView(!isLoginView)} className="w-full text-center mt-6 text-sm text-gray-400 hover:text-white">
                                {isLoginView ? "Don't have an account? Sign up" : "Already have an account? Log in"}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-20">
                    <nav className="border-b border-purple-900/50 bg-black/50 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 className="text-2xl font-black bg-gradient-to-r from-purple-500 to-electric text-transparent bg-clip-text cursor-pointer" onClick={() => { setActiveTab('store'); setIsAdminMode(false); }}>OXY PANNEL</h1>
                            <div className="flex items-center gap-3 sm:gap-4">
                                <button onClick={() => { setActiveTab('store'); setIsAdminMode(false); }} className={`text-sm font-medium ${activeTab === 'store' && !isAdminMode ? 'text-purple-400' : 'text-gray-400'}`}>Store</button>
                                <button onClick={() => { setActiveTab('history'); setIsAdminMode(false); }} className={`text-sm font-medium ${activeTab === 'history' && !isAdminMode ? 'text-purple-400' : 'text-gray-400'}`}>My Orders</button>
                                <span className="bg-gray-800 px-3 py-1 rounded-full text-sm font-bold border border-gray-700 text-purple-400">₹{userData.balance || 0}</span>
                                <button onClick={() => auth.signOut()} className="text-sm bg-red-500/10 text-red-400 px-3 py-1 rounded-full hover:bg-red-500 hover:text-white">Logout</button>
                            </div>
                        </div>
                    </nav>

                    {recentInvoice && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-gray-900 border border-purple-500 rounded-2xl p-6 w-full max-w-md shadow-[0_0_40px_rgba(168,85,247,0.3)]">
                                <div className="text-center mb-6">
                                    <div className="w-12 h-12 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-2 text-2xl">✓</div>
                                    <h3 className="text-2xl font-black text-white">Purchase Successful!</h3>
                                    <p className="text-sm text-gray-400">Official digital invoice & key</p>
                                </div>
                                <div className="bg-black/60 p-4 rounded-xl border border-gray-800 space-y-3 mb-6 text-sm">
                                    <div className="flex justify-between"><span className="text-gray-400">Order ID:</span> <span className="font-mono text-electric">{recentInvoice.orderId}</span></div>
                                    <div className="flex justify-between"><span className="text-gray-400">Duration:</span> <span className="font-bold text-white">{recentInvoice.duration}</span></div>
                                    <div className="flex justify-between"><span className="text-gray-400">Amount Paid:</span> <span className="font-bold text-green-400">₹{recentInvoice.price}</span></div>
                                    <div className="pt-2 border-t border-gray-800">
                                        <div className="text-xs text-purple-400 mb-1 font-semibold uppercase">Your Secret Key:</div>
                                        <div className="bg-gray-900 p-3 rounded border border-purple-500/50 font-mono text-yellow-300 text-center select-all font-bold">{recentInvoice.key}</div>
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(recentInvoice.key); alert("Key copied!"); }} className="flex-1 bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold">Copy Key</button>
                                    <button onClick={() => setRecentInvoice(null)} className="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-bold">Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="max-w-4xl mx-auto px-4 mt-8">
                        {isAdminMode ? (
                            <div className="bg-gray-900 border border-purple-500/50 rounded-xl p-6">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                                    <h2 className="text-2xl font-black text-electric uppercase">Super Admin Dashboard</h2>
                                    <button onClick={() => setIsAdminMode(false)} className="text-red-400 hover:text-red-300 font-bold px-4 py-2 bg-red-500/10 rounded-lg">Close Admin</button>
                                </div>
                                
                                <div className="mb-8 bg-black/50 p-6 rounded-xl border border-gray-800">
                                    <h3 className="text-xl font-bold mb-4 text-green-400">💰 Add Balance to User</h3>
                                    <form onSubmit={adminUpdateBalance} className="flex flex-col md:flex-row gap-4">
                                        <input required type="email" placeholder="User's Email ID" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} className="flex-1 p-3 bg-black border border-gray-700 rounded-lg outline-none" />
                                        <input required type="number" placeholder="Amount (₹)" value={addBalanceAmount} onChange={e=>setAddBalanceAmount(e.target.value)} className="w-full md:w-32 p-3 bg-black border border-gray-700 rounded-lg outline-none" />
                                        <button type="submit" className="bg-green-600 hover:bg-green-500 py-3 px-6 rounded-lg font-bold">Add Funds</button>
                                    </form>
                                </div>

                                <div className="mb-8 bg-black/50 p-6 rounded-xl border border-gray-800">
                                    <h3 className="text-xl font-bold mb-4 text-purple-400">📞 Manage Contact Buttons & Links</h3>
                                    <div className="space-y-4">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="bg-gray-900 p-4 rounded-lg border border-gray-700">
                                                <label className="flex items-center justify-between mb-2">
                                                    <span className="font-bold text-green-400">WhatsApp Link / Chat URL</span>
                                                    <input type="checkbox" checked={productData.showWhatsapp} onChange={e=>setProductData({...productData, showWhatsapp: e.target.checked})} className="w-5 h-5 accent-green-500" />
                                                </label>
                                                <input type="text" placeholder="https://wa.me/917250019052" value={productData.whatsappUrl} onChange={e=>setProductData({...productData, whatsappUrl: e.target.value})} className="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none text-sm" />
                                                <span className="text-xs text-gray-500 mt-1 block">Check box to show on store. Uncheck to hide.</span>
                                            </div>

                                            <div className="bg-gray-900 p-4 rounded-lg border border-gray-700">
                                                <label className="flex items-center justify-between mb-2">
                                                    <span className="font-bold text-electric">Telegram Link / Username URL</span>
                                                    <input type="checkbox" checked={productData.showTelegram} onChange={e=>setProductData({...productData, showTelegram: e.target.checked})} className="w-5 h-5 accent-blue-500" />
                                                </label>
                                                <input type="text" placeholder="https://t.me/Ts_hunter01" value={productData.telegramUrl} onChange={e=>setProductData({...productData, telegramUrl: e.target.value})} className="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none text-sm" />
                                                <span className="text-xs text-gray-500 mt-1 block">Check box to show on store. Uncheck to hide.</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="mb-8 bg-black/50 p-6 rounded-xl border border-gray-800">
                                    <h3 className="text-xl font-bold mb-4 text-purple-400">📦 Edit Product & Key Stock</h3>
                                    <form onSubmit={adminSaveProduct} className="space-y-6">
                                        <div className="bg-gray-900 p-4 rounded-lg border border-gray-700">
                                            <label className="block text-sm text-gray-400 mb-2 font-bold">Direct Video Link (MP4 / Direct URL)</label>
                                            <input type="text" placeholder="Paste direct video URL here..." value={productData.videoUrl} onChange={e=>setProductData({...productData, videoUrl: e.target.value})} className="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none" />
                                        </div>

                                        <div>
                                            <label className="block text-sm text-gray-400 mb-1 font-bold">Panel Description</label>
                                            <textarea required value={productData.details} onChange={e=>setProductData({...productData, details: e.target.value})} className="w-full p-3 bg-black border border-gray-700 rounded-lg h-24"></textarea>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-gray-900 p-4 rounded-lg border border-gray-700">
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Duration 1 Name</label>
                                                <input required value={productData.dur1} onChange={e=>setProductData({...productData, dur1: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg mb-2" />
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Price (₹)</label>
                                                <input required type="number" value={productData.price1} onChange={e=>setProductData({...productData, price1: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg" />
                                                <div className="mt-3 text-xs text-purple-400 font-bold">Stock: {productData.keys1?.length || 0} keys</div>
                                            </div>
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Duration 2 Name</label>
                                                <input required value={productData.dur2} onChange={e=>setProductData({...productData, dur2: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg mb-2" />
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Price (₹)</label>
                                                <input required type="number" value={productData.price2} onChange={e=>setProductData({...productData, price2: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg" />
                                                <div className="mt-3 text-xs text-purple-400 font-bold">Stock: {productData.keys2?.length || 0} keys</div>
                                            </div>
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Duration 3 Name</label>
                                                <input required value={productData.dur3} onChange={e=>setProductData({...productData, dur3: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg mb-2" />
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Price (₹)</label>
                                                <input required type="number" value={productData.price3} onChange={e=>setProductData({...productData, price3: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg" />
                                                <div className="mt-3 text-xs text-purple-400 font-bold">Stock: {productData.keys3?.length || 0} keys</div>
                                            </div>
                                        </div>

                                        <div className="space-y-4 bg-gray-900 p-4 rounded-lg border border-gray-700">
                                            <h4 className="font-bold text-electric">Add Real Keys (One per line)</h4>
                                            <div>
                                                <label className="text-xs text-gray-400">Keys for {productData.dur1}</label>
                                                <div className="flex gap-2 mt-1">
                                                    <textarea placeholder="Paste keys..." value={newKey1} onChange={e=>setNewKey1(e.target.value)} className="flex-1 bg-black p-2 border border-gray-700 rounded h-16 text-xs"></textarea>
                                                    <button type="button" onClick={()=>addKeysToStock('keys1', newKey1, setNewKey1)} className="bg-purple-600 px-4 rounded font-bold text-xs">Add</button>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400">Keys for {productData.dur2}</label>
                                                <div className="flex gap-2 mt-1">
                                                    <textarea placeholder="Paste keys..." value={newKey2} onChange={e=>setNewKey2(e.target.value)} className="flex-1 bg-black p-2 border border-gray-700 rounded h-16 text-xs"></textarea>
                                                    <button type="button" onClick={()=>addKeysToStock('keys2', newKey2, setNewKey2)} className="bg-purple-600 px-4 rounded font-bold text-xs">Add</button>
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-400">Keys for {productData.dur3}</label>
                                                <div className="flex gap-2 mt-1">
                                                    <textarea placeholder="Paste keys..." value={newKey3} onChange={e=>setNewKey3(e.target.value)} className="flex-1 bg-black p-2 border border-gray-700 rounded h-16 text-xs"></textarea>
                                                    <button type="button" onClick={()=>addKeysToStock('keys3', newKey3, setNewKey3)} className="bg-purple-600 px-4 rounded font-bold text-xs">Add</button>
                                                </div>
                                            </div>
                                        </div>

                                        <button type="submit" className="w-full bg-gradient-to-r from-purple-600 to-electric py-4 rounded-lg font-black text-lg">Save Changes Live</button>
                                    </form>
                                </div>

                                <div className="bg-black/50 p-6 rounded-xl border border-gray-800">
                                    <h3 className="text-xl font-bold mb-4 text-electric">📋 Customer Sales Ledger</h3>
                                    <div className="space-y-3 max-h-96 overflow-y-auto">
                                        {allOrders.map(o => (
                                            <div key={o.id} className="bg-gray-900 p-4 rounded-lg border border-gray-800 flex justify-between items-center text-sm">
                                                <div>
                                                    <div className="font-bold text-white">{o.userEmail} <span className="text-electric font-mono text-xs">({o.orderId})</span></div>
                                                    <div className="text-gray-400 text-xs">{o.duration} • ₹{o.price} • {o.date}</div>
                                                </div>
                                                <div className="bg-black px-3 py-1 rounded font-mono text-yellow-300 text-xs">{o.key}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : activeTab === 'history' ? (
                            <div>
                                <h2 className="text-3xl font-black mb-6 uppercase">My Purchase History</h2>
                                {userOrders.length === 0 ? (
                                    <div className="bg-gray-900 p-8 rounded-xl text-center border border-gray-800 text-gray-400">No purchases yet.</div>
                                ) : (
                                    <div className="space-y-4">
                                        {userOrders.map(o => (
                                            <div key={o.id} className="bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col md:flex-row justify-between items-center gap-4">
                                                <div>
                                                    <div className="text-xs text-electric font-mono mb-1">{o.orderId}</div>
                                                    <h4 className="text-xl font-bold text-white">{o.duration} Key</h4>
                                                    <div className="text-sm text-gray-400 mt-1">Paid: ₹{o.price} • {o.date}</div>
                                                </div>
                                                <div className="flex items-center gap-3 w-full md:w-auto">
                                                    <div className="bg-black px-4 py-2 rounded-lg font-mono text-yellow-300 border border-gray-800 flex-1 text-center select-all">{o.key}</div>
                                                    <button onClick={() => { navigator.clipboard.writeText(o.key); alert("Key copied!"); }} className="bg-purple-600 px-4 py-2 rounded-lg font-bold text-sm">Copy</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <>
                                <div className="w-full aspect-video bg-gray-900 rounded-xl overflow-hidden border border-gray-800 shadow-[0_0_20px_rgba(0,0,0,0.5)] mb-6 flex items-center justify-center relative">
                                    {productData.videoUrl ? (
                                        <video className="w-full h-full object-cover" src={productData.videoUrl} controls controlsList="nodownload"></video>
                                    ) : (
                                        <div className="text-gray-500 flex flex-col items-center">
                                            <p>Admin preview video coming soon.</p>
                                        </div>
                                    )}
                                </div>
                                
                                <h2 className="text-3xl font-black mb-2 uppercase tracking-wide">OXY PANNEL KEY</h2>
                                <p className="text-gray-400 mb-8 whitespace-pre-line text-lg">{productData.details}</p>

                                <h3 className="text-xl font-bold mb-4 border-l-4 border-purple-500 pl-3">Select Key Duration</h3>
                                
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
                                    <div className="bg-gray-900 border border-gray-800 p-6 rounded-xl text-center flex flex-col justify-between">
                                        <div>
                                            <h4 className="text-xl font-bold text-gray-300 mb-1">{productData.dur1}</h4>
