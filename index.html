<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXY STORE | Premium Gaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        purple: { 500: '#a855f7', 600: '#9333ea', 900: '#581c87' },
                        electric: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const products = [
            { id: 1, name: "GTA V Premium Edition", price: "₹999", img: "https://images.unsplash.com/photo-1605901309584-818e25960b8f?auto=format&fit=crop&w=400&q=80", type: "Game Key" },
            { id: 2, name: "Netflix 1 Month", price: "₹199", img: "https://images.unsplash.com/photo-1522869635100-9f4c5e86aa37?auto=format&fit=crop&w=400&q=80", type: "Account" },
            { id: 3, name: "Valorant 1000 VP", price: "₹750", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80", type: "Gift Card" },
            { id: 4, name: "Spotify Premium", price: "₹99", img: "https://images.unsplash.com/photo-1611339555312-e607c8352fd7?auto=format&fit=crop&w=400&q=80", type: "Account" }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('home');

            return (
                <div className="pb-20">
                    {/* Navbar */}
                    <nav className="border-b border-purple-900/50 bg-black/50 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 className="text-2xl font-black bg-gradient-to-r from-purple-500 to-electric text-transparent bg-clip-text tracking-wider">
                                OXY STORE
                            </h1>
                            <div className="flex gap-4">
                                <button onClick={() => setActiveTab('home')} className={`font-medium ${activeTab === 'home' ? 'text-purple-400' : 'text-gray-400'}`}>Home</button>
                                <button onClick={() => setActiveTab('store')} className={`font-medium ${activeTab === 'store' ? 'text-purple-400' : 'text-gray-400'}`}>Store</button>
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    {activeTab === 'home' && (
                        <div className="max-w-6xl mx-auto px-4 mt-12 text-center">
                            <div className="relative inline-block mt-8">
                                <div className="absolute -inset-1 bg-gradient-to-r from-purple-600 to-electric rounded-lg blur opacity-40"></div>
                                <div className="relative bg-black border border-purple-500/30 p-10 md:p-16 rounded-lg">
                                    <h2 className="text-5xl md:text-7xl font-black mb-4 uppercase">Your Game.<br/>Your Edge.</h2>
                                    <p className="text-gray-400 mb-8 max-w-lg mx-auto">Get premium game keys, gift cards, and accounts instantly. Dark, sleek, and fast.</p>
                                    <button onClick={() => setActiveTab('store')} className="bg-gradient-to-r from-purple-600 to-electric px-8 py-3 rounded-full font-bold text-lg shadow-[0_0_20px_rgba(168,85,247,0.4)] hover:scale-105 transition-transform">
                                        Explore Store
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Store Section */}
                    {activeTab === 'store' && (
                        <div className="max-w-6xl mx-auto px-4 mt-10">
                            <h3 className="text-3xl font-bold mb-8 border-l-4 border-purple-500 pl-4">Premium Assets</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
                                {products.map(p => (
                                    <div key={p.id} className="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden hover:border-purple-500/50 transition-colors group">
                                        <img src={p.img} className="w-full h-48 object-cover group-hover:scale-105 transition-transform duration-500" alt={p.name} />
                                        <div className="p-5">
                                            <div className="text-xs text-purple-400 mb-1 font-semibold tracking-wide uppercase">{p.type}</div>
                                            <h4 className="text-lg font-bold mb-3">{p.name}</h4>
                                            <div className="flex justify-between items-center">
                                                <span className="text-xl font-black">{p.price}</span>
                                                <button className="bg-white/10 hover:bg-purple-600 px-4 py-2 rounded-lg font-bold transition-colors">
                                                    Buy Now
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="mt-20 border-t border-gray-800 py-8 text-center text-gray-500">
                        <p>© 2026 OXY STORE. All rights reserved.</p>
                        <a href="#" className="inline-block mt-4 text-electric hover:text-purple-400">Telegram Support</a>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
