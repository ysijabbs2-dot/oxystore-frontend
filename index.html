<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXY PANNEL | Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti JS -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            theme: { 
                extend: { 
                    colors: { purple: { 500: '#a855f7', 600: '#9333ea', 900: '#581c87' }, electric: '#3b82f6' },
                    animation: { 'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite' }
                } 
            }
        }
    </script>
    <!-- React & Firebase -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <style>
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.6); }
        }
        .neon-box { animation: glow 4s infinite; }
    </style>
</head>
<body class="bg-[#070707] text-white min-h-screen font-sans selection:bg-purple-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyB3OisQMTrOp_OTqEdVM3l1O_ojUNcky4E",
            authDomain: "oxy-pannel.firebaseapp.com",
            projectId: "oxy-pannel",
            storageBucket: "oxy-pannel.firebasestorage.app",
            messagingSenderId: "1051170940546",
            appId: "1:1051170940546:web:d2d438b07327441d94b69b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState({ balance: 0 });
            const [activeTab, setActiveTab] = useState('store');
            
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLoginView, setIsLoginView] = useState(true);

            const defaultProductData = { 
                videoUrl: "", 
                announcement: "🔥 Welcome to OXY PANNEL! Instant automated key delivery active 24/7.",
                details: "OXY PANNEL Premium Version.\nBest features and high performance anti-ban protection.", 
                whatsappUrl: "https://wa.me/2348029770616",
                whatsappNumber: "+234 802 977 0616",
                telegramUrl: "https://t.me/Ts_hunter01",
                showWhatsapp: true,
                showWhatsappCopy: true,
                showTelegram: true,
                plans: [
                    { id: "plan1", name: "3 Hours", price: 147, keys: [] },
                    { id: "plan2", name: "6 Hours", price: 250, keys: [], recommended: true },
                    { id: "plan3", name: "1 Day", price: 380, keys: [] }
                ]
            };

            const [productData, setProductData] = useState(defaultProductData);
            const [userOrders, setUserOrders] = useState([]);
            const [allOrders, setAllOrders] = useState([]);
            const [recentInvoice, setRecentInvoice] = useState(null);

            const [newKeyInputs, setNewKeyInputs] = useState({});
            const [adminEmail, setAdminEmail] = useState('');
            const [addBalanceAmount, setAddBalanceAmount] = useState('');
            const [isAdminMode, setIsAdminMode] = useState(false);

            useEffect(() => {
                const unsubProduct = db.collection('settings').doc('product').onSnapshot(doc => {
                    if(doc.exists) {
                        const data = doc.data();
                        setProductData({ ...defaultProductData, ...data });
                    } else {
                        db.collection('settings').doc('product').set(defaultProductData);
                    }
                });

                const unsubAuth = auth.onAuthStateChanged(usr => {
                    setUser(usr);
                    if(usr) {
                        db.collection('users').doc(usr.uid).onSnapshot(doc => {
                            if(doc.exists) setUserData(doc.data());
                            else db.collection('users').doc(usr.uid).set({ email: usr.email, balance: 0 });
                        });

                        db.collection('orders').where('userId', '==', usr.uid).orderBy('date', 'desc').onSnapshot(snapshot => {
                            setUserOrders(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                        });
                    }
                });

                db.collection('orders').orderBy('date', 'desc').onSnapshot(snapshot => {
                    setAllOrders(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                });

                return () => { unsubProduct(); unsubAuth(); };
            }, []);

            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    if (isLoginView) await auth.signInWithEmailAndPassword(email, password);
                    else await auth.createUserWithEmailAndPassword(email, password);
                    setEmail(''); setPassword('');
                } catch (error) {
                    alert(error.message);
                }
            };

            const handleBuy = async (planIndex) => {
                const plan = productData.plans[planIndex];
                const stockList = plan.keys || [];
                
                if (stockList.length === 0) {
                    alert(`Sorry! ${plan.name} keys are currently out of stock.`);
                    return;
                }
                if (userData.balance < plan.price) {
                    alert("Aapke wallet mein balance kam hai. Kripya Admin se contact karein.");
                    return;
                }

                if (confirm(`Confirm purchase of ${plan.name} Key for ₹${plan.price}?`)) {
                    try {
                        const assignedKey = stockList[0];
                        const updatedKeys = stockList.slice(1);

                        const updatedPlans = [...productData.plans];
                        updatedPlans[planIndex].keys = updatedKeys;

                        await db.collection('users').doc(user.uid).update({ balance: userData.balance - plan.price });
                        await db.collection('settings').doc('product').update({ plans: updatedPlans });

                        const orderId = "OXY-" + Math.floor(100000 + Math.random() * 900000);
                        const orderData = {
                            orderId,
                            userId: user.uid,
                            userEmail: user.email,
                            duration: plan.name,
                            price: plan.price,
                            key: assignedKey,
                            date: new Date().toLocaleString()
                        };
                        await db.collection('orders').add(orderData);
                        setRecentInvoice(orderData);

                        // Confetti Celebration Blast!
                        confetti({
                            particleCount: 120,
                            spread: 70,
                            origin: { y: 0.6 }
                        });
                    } catch(err) {
                        alert("Error processing purchase: " + err.message);
                    }
                }
            };

            const adminUpdateBalance = async (e) => {
                e.preventDefault();
                try {
                    const usersRef = await db.collection('users').where('email', '==', adminEmail).get();
                    if(usersRef.empty) { alert("User not found!"); return; }
                    let targetUid = usersRef.docs[0].id;
                    let currentBal = usersRef.docs[0].data().balance || 0;
                    await db.collection('users').doc(targetUid).update({ balance: currentBal + parseInt(addBalanceAmount) });
                    alert(`Balance added successfully!`);
                    setAdminEmail(''); setAddBalanceAmount('');
                } catch(error) { alert("Error adding balance"); }
            };

            const adminSaveProduct = async (e) => {
                e.preventDefault();
                await db.collection('settings').doc('product').set(productData, { merge: true });
                alert("Panel settings & products updated live!");
            };

            const addPlan = () => {
                const newPlan = { id: "plan_" + Date.now(), name: "New Plan", price: 199, keys: [] };
                setProductData({ ...productData, plans: [...productData.plans, newPlan] });
            };

            const removePlan = (index) => {
                const updated = productData.plans.filter((_, i) => i !== index);
                setProductData({ ...productData, plans: updated });
            };

            const updatePlanField = (index, field, value) => {
                const updated = [...productData.plans];
                updated[index][field] = value;
                setProductData({ ...productData, plans: updated });
            };

            const addKeysToPlan = (index) => {
                const rawInput = newKeyInputs[index] || '';
                if(!rawInput.trim()) return;
                const newKeys = rawInput.split('\n').map(k => k.trim()).filter(k => k.length > 0);
                
                const updated = [...productData.plans];
                updated[index].keys = [...(updated[index].keys || []), ...newKeys];
                setProductData({ ...productData, plans: updated });
                
                setNewKeyInputs({ ...newKeyInputs, [index]: '' });
                alert(`${newKeys.length} keys added to ${updated[index].name}! Click 'Save Changes Live'.`);
            };

            if (!user) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4 relative overflow-hidden bg-[#070707]">
                        <div className="absolute w-96 h-96 bg-purple-600/10 rounded-full blur-3xl -top-20 -left-20 pointer-events-none"></div>
                        <div className="bg-gray-900/90 backdrop-blur-xl p-8 rounded-2xl w-full max-w-md border border-purple-500/30 shadow-[0_0_40px_rgba(168,85,247,0.15)] z-10">
                            <h2 className="text-3xl font-black mb-2 text-center bg-gradient-to-r from-purple-400 via-purple-500 to-electric text-transparent bg-clip-text">OXY PANNEL</h2>
                            <p className="text-center text-gray-400 mb-8 text-sm">{isLoginView ? 'Login to your secure account' : 'Create a new account'}</p>
                            <form onSubmit={handleAuth} className="space-y-4">
                                <input type="email" required placeholder="Email Address" value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-3.5 bg-black/80 border border-gray-800 rounded-xl focus:border-purple-500 outline-none transition text-sm" />
                                <input type="password" required placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3.5 bg-black/80 border border-gray-800 rounded-xl focus:border-purple-500 outline-none transition text-sm" />
                                <button type="submit" className="w-full bg-gradient-to-r from-purple-600 to-electric py-3.5 rounded-xl font-bold hover:opacity-90 transition shadow-lg shadow-purple-600/20">
                                    {isLoginView ? 'Log In' : 'Sign Up'}
                                </button>
                            </form>
                            <button onClick={() => setIsLoginView(!isLoginView)} className="w-full text-center mt-6 text-xs text-gray-400 hover:text-white transition">
                                {isLoginView ? "Don't have an account? Sign up" : "Already have an account? Log in"}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-20">
                    {/* Live Ticker Bar */}
                    {productData.announcement && (
                        <div className="bg-purple-900/40 border-b border-purple-500/20 text-purple-300 text-xs py-2 px-4 overflow-hidden whitespace-nowrap">
                            <div className="inline-block animate-marquee font-medium">
                                {productData.announcement}
                            </div>
                        </div>
                    )}

                    <nav className="border-b border-gray-800/80 bg-black/60 backdrop-blur-md sticky top-0 z-40">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 className="text-xl sm:text-2xl font-black bg-gradient-to-r from-purple-400 to-electric text-transparent bg-clip-text cursor-pointer tracking-wider" onClick={() => { setActiveTab('store'); setIsAdminMode(false); }}>OXY PANNEL</h1>
                            <div className="flex items-center gap-2 sm:gap-4">
                                <button onClick={() => { setActiveTab('store'); setIsAdminMode(false); }} className={`text-xs sm:text-sm font-medium px-3 py-1.5 rounded-lg transition ${activeTab === 'store' && !isAdminMode ? 'bg-purple-600/20 text-purple-400 border border-purple-500/30' : 'text-gray-400 hover:text-white'}`}>Store</button>
                                <button onClick={() => { setActiveTab('history'); setIsAdminMode(false); }} className={`text-xs sm:text-sm font-medium px-3 py-1.5 rounded-lg transition ${activeTab === 'history' && !isAdminMode ? 'bg-purple-600/20 text-purple-400 border border-purple-500/30' : 'text-gray-400 hover:text-white'}`}>My Orders</button>
                                <span className="bg-gray-900 px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold border border-gray-800 text-purple-400 shadow-inner">₹{userData.balance || 0}</span>
                                <button onClick={() => auth.signOut()} className="text-xs sm:text-sm bg-red-500/10 text-red-400 px-3 py-1.5 rounded-xl hover:bg-red-500 hover:text-white transition">Logout</button>
                            </div>
                        </div>
                    </nav>

                    {recentInvoice && (
                        <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-gray-900 border border-purple-500/60 rounded-2xl p-6 w-full max-w-md shadow-[0_0_50px_rgba(168,85,247,0.3)]">
                                <div className="text-center mb-6">
                                    <div className="w-14 h-14 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl animate-bounce">✓</div>
                                    <h3 className="text-2xl font-black text-white">Purchase Successful!</h3>
                                    <p className="text-xs text-gray-400 mt-1">Your license key is generated securely</p>
                                </div>
                                <div className="bg-black/80 p-4 rounded-xl border border-gray-800 space-y-3 mb-6 text-sm">
                                    <div className="flex justify-between"><span className="text-gray-400">Order ID:</span> <span className="font-mono text-electric">{recentInvoice.orderId}</span></div>
                                    <div className="flex justify-between"><span className="text-gray-400">Duration:</span> <span className="font-bold text-white">{recentInvoice.duration}</span></div>
                                    <div className="flex justify-between"><span className="text-gray-400">Amount Paid:</span> <span className="font-bold text-green-400">₹{recentInvoice.price}</span></div>
                                    <div className="pt-3 border-t border-gray-800">
                                        <div className="text-xs text-purple-400 mb-1 font-semibold uppercase tracking-wider">Your Secret Key:</div>
                                        <div className="bg-gray-950 p-3.5 rounded-xl border border-purple-500/40 font-mono text-yellow-300 text-center select-all font-bold text-sm tracking-wide">{recentInvoice.key}</div>
                                    </div>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => { navigator.clipboard.writeText(recentInvoice.key); alert("Key copied to clipboard!"); }} className="flex-1 bg-gradient-to-r from-purple-600 to-purple-500 hover:opacity-90 py-3 rounded-xl font-bold text-sm shadow-lg shadow-purple-600/20 transition">Copy Key</button>
                                    <button onClick={() => setRecentInvoice(null)} className="flex-1 bg-gray-800 hover:bg-gray-700 py-3 rounded-xl font-bold text-sm transition">Close</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="max-w-4xl mx-auto px-4 mt-8">
                        {isAdminMode ? (
                            <div className="bg-gray-900/90 border border-purple-500/40 rounded-2xl p-6 shadow-2xl backdrop-blur-xl">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                                    <h2 className="text-2xl font-black text-electric uppercase tracking-wide">Super Admin Dashboard</h2>
                                    <button onClick={() => setIsAdminMode(false)} className="text-red-400 hover:text-red-300 font-bold px-4 py-2 bg-red-500/10 rounded-xl text-xs transition">Close Admin</button>
                                </div>
                                
                                <div className="mb-8 bg-black/60 p-6 rounded-xl border border-gray-800">
                                    <h3 className="text-lg font-bold mb-4 text-green-400 flex items-center gap-2">💰 Add Balance to User</h3>
                                    <form onSubmit={adminUpdateBalance} className="flex flex-col md:flex-row gap-3">
                                        <input required type="email" placeholder="User's Email ID" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} className="flex-1 p-3 bg-black border border-gray-800 rounded-xl outline-none text-sm focus:border-green-500 transition" />
                                        <input required type="number" placeholder="Amount (₹)" value={addBalanceAmount} onChange={e=>setAddBalanceAmount(e.target.value)} className="w-full md:w-32 p-3 bg-black border border-gray-800 rounded-xl outline-none text-sm focus:border-green-500 transition" />
                                        <button type="submit" className="bg-green-600 hover:bg-green-500 py-3 px-6 rounded-xl font-bold text-sm transition shadow-lg shadow-green-600/20">Add Funds</button>
                                    </form>
                                </div>

                                <div className="mb-8 bg-black/60 p-6 rounded-xl border border-gray-800">
                                    <h3 className="text-lg font-bold mb-4 text-purple-400">📞 Contact Links & Announcement</h3>
                                    <div className="space-y-4">
                                        <div>
                                            <label className="block text-xs text-gray-400 mb-1 font-bold">Announcement Ticker Text</label>
                                            <input type="text" value={productData.announcement || ''} onChange={e=>setProductData({...productData, announcement: e.target.value})} className="w-full p-3 bg-black border border-gray-800 rounded-xl outline-none text-sm focus:border-purple-500 transition" />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            <div className="bg-gray-900 p-4 rounded-xl border border-gray-800">
                                                <label className="flex items-center justify-between mb-2">
                                                    <span className="font-bold text-green-400 text-xs">WhatsApp Button</span>
                                                    <input type="checkbox" checked={productData.showWhatsapp} onChange={e=>setProductData({...productData, showWhatsapp: e.target.checked})} className="w-4 h-4 accent-green-500" />
                                                </label>
                                                <input type="text" placeholder="https://wa.me/..." value={productData.whatsappUrl} onChange={e=>setProductData({...productData, whatsappUrl: e.target.value})} className="w-full p-2.5 bg-black border border-gray-800 rounded-lg outline-none text-xs" />
                                            </div>

                                            <div className="bg-gray-900 p-4 rounded-xl border border-gray-800">
                                                <label className="flex items-center justify-between mb-2">
                                                    <span className="font-bold text-green-300 text-xs">Copy Number Button</span>
                                                    <input type="checkbox" checked={productData.showWhatsappCopy} onChange={e=>setProductData({...productData, showWhatsappCopy: e.target.checked})} className="w-4 h-4 accent-green-500" />
                                                </label>
                                                <input type="text" placeholder="+234..." value={productData.whatsappNumber} onChange={e=>setProductData({...productData, whatsappNumber: e.target.value})} className="w-full p-2.5 bg-black border border-gray-800 rounded-lg outline-none text-xs" />
                                            </div>

                                            <div className="bg-gray-900 p-4 rounded-xl border border-gray-800">
                                                <label className="flex items-center justify-between mb-2">
                                                    <span className="font-bold text-electric text-xs">Telegram Button</span>
                                                    <input type="checkbox" checked={productData.showTelegram} onChange={e=>setProductData({...productData, showTelegram: e.target.checked})} className="w-4 h-4 accent-blue-500" />
                                                </label>
                                                <input type="text" placeholder="https://t.me/..." value={productData.telegramUrl} onChange={e=>setProductData({...productData, telegramUrl: e.target.value})} className="w-full p-2.5 bg-black border border-gray-800 rounded-lg outline-none text-xs" />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div className="mb-8 bg-black/60 p-6 rounded-xl border border-gray-800">
                                    <div className="flex justify-between items-center mb-4">
                                        <h3 className="text-lg font-bold text-purple-400">📦 Manage Plans & Unlimited Key Stock</h3>
                                        <button type="button" onClick={addPlan} className="bg-purple-600 hover:bg-purple-500 px-3 py-1.5 rounded-lg text-xs font-bold transition">+ Add New Plan</button>
                                    </div>

                                    <form onSubmit={adminSaveProduct} className="space-y-6">
                                        <div className="bg-gray-900 p-4 rounded-xl border border-gray-800">
                                            <label className="block text-xs text-gray-400 mb-1 font-bold">Direct Video Link (MP4 / Direct URL)</label>
                                            <input type="text" placeholder="Paste direct video URL here..." value={productData.videoUrl} onChange={e=>setProductData({...productData, videoUrl: e.target.value})} className="w-full p-3 bg-black border border-gray-800 rounded-xl outline-none text-sm" />
                                        </div>

                                        <div>
                                            <label className="block text-xs text-gray-400 mb-1 font-bold">Panel Description</label>
                                            <textarea required value={productData.details} onChange={e=>setProductData({...productData, details: e.target.value})} className="w-full p-3 bg-black border border-gray-800 rounded-xl h-24 text-sm outline-none"></textarea>
                                        </div>
                                        
                                        {/* Dynamic Plans Editor */}
                                        <div className="space-y-4">
                                            {productData.plans?.map((plan, index) => (
                                                <div key={plan.id || index} className="bg-gray-900 p-5 rounded-xl border border-gray-800 relative space-y-4">
                                                    <div className="flex justify-between items-center">
                                                        <span className="text-xs font-bold text-purple-400 uppercase tracking-wider">Plan #{index + 1}</span>
                                                        <button type="button" onClick={() => removePlan(index)} className="text-red-400 hover:text-red-300 text-xs font-bold bg-red-500/10 px-2.5 py-1 rounded-lg">Delete Plan</button>
                                                    </div>

                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                        <div>
                                                            <label className="block text-xs text-gray-400 mb-1">Duration Name (e.g., 2 Days)</label>
                                                            <input required type="text" value={plan.name} onChange={e => updatePlanField(index, 'name', e.target.value)} className="w-full p-2.5 bg-black border border-gray-800 rounded-lg text-sm" />
                                                        </div>
                                                        <div>
                                                            <label className="block text-xs text-gray-400 mb-1">Price (₹)</label>
                                                            <input required type="number" value={plan.price} onChange={e => updatePlanField(index, 'price', e.target.value)} className="w-full p-2.5 bg-black border border-gray-800 rounded-lg text-sm" />
                                                        </div>
                                                    </div>

                                                    <div className="flex items-center gap-2">
                                                        <input type="checkbox" checked={plan.recommended || false} onChange={e => updatePlanField(index, 'recommended', e.target.checked)} className="w-4 h-4 accent-purple-500" />
                                                        <label className="text-xs text-gray-300">Mark as Recommended Plan (Glowing Badge)</label>
                                                    </div>

                                                    <div className="bg-black/50 p-3 rounded-lg border border-gray-800">
                                                        <div className="flex justify-between items-center mb-2">
                                                            <span className="text-xs font-bold text-green-400">Stock Count: {plan.keys?.length || 0} Keys</span>
                                                        </div>
                                                        <label className="block text-xs text-gray-400 mb-1">Add New Keys (One per line)</label>
                                                        <div className="flex gap-2">
                                                            <textarea placeholder="Paste keys here..." value={newKeyInputs[index] || ''} onChange={e => setNewKeyInputs({...newKeyInputs, [index]: e.target.value})} className="flex-1 bg-black p-2.5 border border-gray-800 rounded-lg h-16 text-xs outline-none"></textarea>
                                                            <button type="button" onClick={() => addKeysToPlan(index)} className="bg-purple-600 hover:bg-purple-500 px-4 rounded-lg font-bold text-xs transition">Add Keys</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <button type="submit" className="w-full bg-gradient-to-r from-purple-600 to-electric py-4 rounded-xl font-black text-base shadow-xl shadow-purple-600/20 transition hover:opacity-90">Save Changes Live</button>
                                    </form>
                                </div>

                                <div className="bg-black/60 p-6 rounded-xl border border-gray-800">
                                    <h3 className="text-lg font-bold mb-4 text-electric">📋 Customer Sales Ledger</h3>
                                    <div className="space-y-3 max-h-96 overflow-y-auto">
                                        {allOrders.map(o => (
                                            <div key={o.id} className="bg-gray-900 p-4 rounded-xl border border-gray-800 flex justify-between items-center text-sm">
                                                <div>
                                                    <div className="font-bold text-white text-xs">{o.userEmail} <span className="text-electric font-mono">({o.orderId})</span></div>
                                                    <div className="text-gray-400 text-xs mt-0.5">{o.duration} • ₹{o.price} • {o.date}</div>
                                                </div>
                                                <div className="bg-black px-3 py-1 rounded-lg font-mono text-yellow-300 text-xs border border-gray-800">{o.key}</div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : activeTab === 'history' ? (
                            <div>
                                <h2 className="text-2xl sm:text-3xl font-black mb-6 uppercase tracking-wide">My Purchase History</h2>
                                {userOrders.length === 0 ? (
                                    <div className="bg-gray-900/60 p-8 rounded-2xl text-center border border-gray-800 text-gray-400 text-sm">No purchases yet.</div>
                                ) : (
                                    <div className="space-y-4">
                                        {userOrders.map(o => (
                                            <div key={o.id} className="bg-gray-900/80 border border-gray-800/80 rounded-2xl p-5 flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg backdrop-blur-md">
                                                <div>
                                                    <div className="text-xs text-electric font-mono mb-1">{o.orderId}</div>
                                                    <h4 className="text-xl font-bold text-white">{o.duration} Key</h4>
                                                    <div className="text-xs text-gray-400 mt-1">Paid: ₹{o.price} • {o.date}</div>
                                                </div>
                                                <div className="flex items-center gap-3 w-full md:w-auto">
                                                    <div className="bg-black px-4 py-2.5 rounded-xl font-mono text-yellow-300 border border-gray-800 flex-1 text-center select-all text-xs font-bold">{o.key}</div>
                                                    <button onClick={() => { navigator.clipboard.writeText(o.key); alert("Key copied!"); }} className="bg-purple-600 hover:bg-purple-500 px-4 py-2.5 rounded-xl font-bold text-xs transition">Copy</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <>
                                <div className="w-full aspect-video bg-gray-900 rounded-2xl overflow-hidden border border-gray-800/80 shadow-[0_0_30px_rgba(0,0,0,0.6)] mb-6 flex items-center justify-center relative">
                                    {productData.videoUrl ? (
                                        <video className="w-full h-full object-cover" src={productData.videoUrl} controls controlsList="nodownload"></video>
                                    ) : (
                                        <div className="text-gray-500 flex flex-col items-center text-xs">
                                            <p>Admin preview video coming soon.</p>
                                        </div>
                                    )}
                                </div>
                                
                                <h2 className="text-2xl sm:text-3xl font-black mb-2 uppercase tracking-wide">OXY PANNEL KEY</h2>
                                <p className="text-gray-400 mb-8 whitespace-pre-line text-sm sm:text-base leading-relaxed">{productData.details}</p>

                                <h3 className="text-lg sm:text-xl font-bold mb-5 border-l-4 border-purple-500 pl-3 tracking-wide">Select Key Duration</h3>
                                
                                {/* Dynamic Plans Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mb-10">
                                    {productData.plans?.map((plan, index) => {
                                        const stockCount = plan.keys?.length || 0;
                                        const isAvailable = stockCount > 0;
                                        const isRec = plan.recommended;

                                        return (
                                            <div key={plan.id || index} className={`bg-gray-900/80 backdrop-blur-xl border ${isRec ? 'border-purple-500 neon-box' : 'border-gray-800/80'} p-6 rounded-2xl text-center flex flex-col justify-between relative shadow-xl transition hover:border-purple-500/50`}>
                                                {isRec && (
                                                    <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-gradient-to-r from-purple-600 to-electric text-[10px] font-black px-3.5 py-1 rounded-full uppercase tracking-widest shadow-lg">RECOMMENDED</div>
                                                )}
                                                <div>
                                                    <h4 className={`text-xl font-bold text-gray-200 mb-1 ${isRec ? 'mt-2' : ''}`}>{plan.name}</h4>
                                                    <div className="text-3xl font-black text-purple-400 mb-2">₹{plan.price}</div>
                                                    <div className={`text-xs font-bold mb-6 ${isAvailable ? 'text-green-400' : 'text-red-400'}`}>
                                                        Stock Left: {stockCount} Keys
                                                    </div>
                                                </div>
                                                <button 
                                                    disabled={!isAvailable}
                                                    onClick={() => handleBuy(index)} 
                                                    className={`w-full py-3 rounded-xl font-bold text-sm transition ${isAvailable ? (isRec ? 'bg-gradient-to-r from-purple-600 to-electric text-white shadow-lg shadow-purple-600/20 hover:opacity-90' : 'bg-white/10 hover:bg-purple-600 text-white') : 'bg-gray-800/60 text-gray-500 cursor-not-allowed'}`}
                                                >
                                                    {isAvailable ? 'Purchase Key' : 'Out of Stock'}
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="bg-gradient-to-r from-gray-900/90 to-black border border-gray-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-md">
                                    <h4 className="text-lg font-bold text-white mb-2">How to Add Balance?</h4>
                                    <p className="text-gray-400 text-xs sm:text-sm mb-6">Send payment to Admin and share screenshot along with your email: <strong className="text-white">{user.email}</strong></p>
                                    
                                    <div className="flex flex-col sm:flex-row gap-3">
                                        {productData.showWhatsapp && (
                                            <a href={productData.whatsappUrl} target="_blank" className="flex-1 flex items-center justify-center gap-2 bg-[#25D366] text-white px-6 py-3 rounded-xl font-bold text-sm hover:opacity-90 transition shadow-lg shadow-[#25D366]/20">WhatsApp Chat</a>
                                        )}
                                        {productData.showWhatsappCopy && (
                                            <button onClick={() => { navigator.clipboard.writeText(productData.whatsappNumber); alert("WhatsApp Number Copied: " + productData.whatsappNumber); }} className="flex-1 flex items-center justify-center gap-2 bg-gray-900 border border-green-500/40 text-green-400 px-6 py-3 rounded-xl font-bold text-sm hover:bg-gray-800 transition">Copy WhatsApp Number</button>
                                        )}
                                        {productData.showTelegram && (
                                            <a href={productData.telegramUrl} target="_blank" className="flex-1 flex items-center justify-center gap-2 bg-[#0088cc] text-white px-6 py-3 rounded-xl font-bold text-sm hover:opacity-90 transition shadow-lg shadow-[#0088cc]/20">Telegram</a>
                                        )}
                                    </div>
                                </div>
                            </>
                        )}
                    </div>

                    <footer className="mt-20 border-t border-gray-900 py-8 text-center text-gray-600 text-xs flex flex-col items-center">
                        <p className="mb-2">© 2026 OXY PANNEL. All rights reserved.</p>
                        {!isAdminMode && (
                            <button onClick={() => {
                                const pass = prompt("Enter Admin Password:");
                                if(pass === "stormy3262") setIsAdminMode(true);
                                else if(pass) alert("Wrong Password!");
                            }} className="text-gray-700 hover:text-purple-400 font-bold tracking-widest text-[10px] cursor-pointer transition">ADMIN ACCESS</button>
                        )}
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
