<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OXY PANNEL | Premium Keys</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { purple: { 500: '#a855f7', 600: '#9333ea', 900: '#581c87' }, electric: '#3b82f6' } } }
        }
    </script>
    <!-- React & Firebase -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
</head>
<body class="bg-[#0a0a0a] text-white min-h-screen font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Aapka Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyB3OisQMTrOp_OTqEdVM3l1O_ojUNcky4E",
            authDomain: "oxy-pannel.firebaseapp.com",
            projectId: "oxy-pannel",
            storageBucket: "oxy-pannel.firebasestorage.app",
            messagingSenderId: "1051170940546",
            appId: "1:1051170940546:web:d2d438b07327441d94b69b"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        function App() {
            const [user, setUser] = useState(null);
            const [userData, setUserData] = useState({ balance: 0 });
            
            // Auth States
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [isLoginView, setIsLoginView] = useState(true);

            // Product States (Default Values set by you)
            const defaultProductData = { 
                videoUrl: "", 
                details: "OXY PANNEL Premium Version.\nBest features and anti-ban protection.", 
                dur1: "3 Hours", price1: 147, 
                dur2: "6 Hours", price2: 250, 
                dur3: "1 Day", price3: 380 
            };
            const [productData, setProductData] = useState(defaultProductData);
            
            // Admin States
            const [adminEmail, setAdminEmail] = useState('');
            const [addBalanceAmount, setAddBalanceAmount] = useState('');
            const [isAdminMode, setIsAdminMode] = useState(false);
            const [uploading, setUploading] = useState(false);

            useEffect(() => {
                // Fetch Product Data
                const unsubProduct = db.collection('settings').doc('product').onSnapshot(doc => {
                    if(doc.exists) setProductData(doc.data());
                    else db.collection('settings').doc('product').set(defaultProductData);
                });

                // Auth Listener
                const unsubAuth = auth.onAuthStateChanged(usr => {
                    setUser(usr);
                    if(usr) {
                        db.collection('users').doc(usr.uid).onSnapshot(doc => {
                            if(doc.exists) setUserData(doc.data());
                            else db.collection('users').doc(usr.uid).set({ email: usr.email, balance: 0 });
                        });
                    }
                });
                return () => { unsubProduct(); unsubAuth(); };
            }, []);

            const handleAuth = async (e) => {
                e.preventDefault();
                try {
                    if (isLoginView) await auth.signInWithEmailAndPassword(email, password);
                    else await auth.createUserWithEmailAndPassword(email, password);
                    setEmail(''); setPassword('');
                } catch (error) {
                    alert(error.message);
                }
            };

            const handleBuy = async (duration, price) => {
                if(userData.balance < price) {
                    alert("Aapke wallet mein balance kam hai. Kripya Admin se contact karke balance add karwayein.");
                    return;
                }
                if(confirm(`Are you sure you want to buy ${duration} Key for ₹${price}?`)) {
                    try {
                        await db.collection('users').doc(user.uid).update({ balance: userData.balance - price });
                        const key = "OXY-" + Math.random().toString(36).substring(2, 10).toUpperCase();
                        alert(`Purchase Successful! 🎉\n\nYour Key is: ${key}\n\n(Please copy and save this key securely)`);
                    } catch(err) {
                        alert("Error processing purchase.");
                    }
                }
            };

            const adminUpdateBalance = async (e) => {
                e.preventDefault();
                try {
                    const usersRef = await db.collection('users').where('email', '==', adminEmail).get();
                    if(usersRef.empty) { alert("User not found! Unhone account nahi banaya hai."); return; }
                    
                    let targetUid = usersRef.docs[0].id;
                    let currentBal = usersRef.docs[0].data().balance || 0;
                    
                    await db.collection('users').doc(targetUid).update({ balance: currentBal + parseInt(addBalanceAmount) });
                    alert(`Balance added! New Balance for ${adminEmail} is ₹${currentBal + parseInt(addBalanceAmount)}`);
                    setAdminEmail(''); setAddBalanceAmount('');
                } catch(error) { alert("Error adding balance"); }
            };

            const adminSaveProduct = async (e) => {
                e.preventDefault();
                await db.collection('settings').doc('product').set(productData);
                alert("Product settings updated live!");
            };

            const handleVideoUpload = async (e) => {
                const file = e.target.files[0];
                if(!file) return;
                setUploading(true);
                try {
                    const storageRef = storage.ref();
                    const videoRef = storageRef.child(`videos/${Date.now()}_${file.name}`);
                    await videoRef.put(file);
                    const url = await videoRef.getDownloadURL();
                    setProductData({...productData, videoUrl: url});
                    alert("Video Uploaded! Now click 'Save Product Changes Live' button below.");
                } catch(error) {
                    alert("Upload failed: " + error.message);
                }
                setUploading(false);
            };

            if (!user) {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4 relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-full bg-gradient-to-b from-purple-900/20 to-black pointer-events-none"></div>
                        <div className="bg-gray-900 p-8 rounded-xl w-full max-w-md border border-purple-500/50 shadow-[0_0_30px_rgba(168,85,247,0.2)] z-10">
                            <h2 className="text-3xl font-black mb-2 text-center bg-gradient-to-r from-purple-500 to-electric text-transparent bg-clip-text">OXY PANNEL</h2>
                            <p className="text-center text-gray-400 mb-8">{isLoginView ? 'Login to your account' : 'Create a new account'}</p>
                            
                            <form onSubmit={handleAuth} className="space-y-4">
                                <input type="email" required placeholder="Email Address" value={email} onChange={e=>setEmail(e.target.value)} className="w-full p-3 bg-black border border-gray-700 rounded-lg focus:border-purple-500 outline-none transition-colors" />
                                <input type="password" required placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full p-3 bg-black border border-gray-700 rounded-lg focus:border-purple-500 outline-none transition-colors" />
                                <button type="submit" className="w-full bg-gradient-to-r from-purple-600 to-electric py-3 rounded-lg font-bold hover:scale-[1.02] transition-transform">
                                    {isLoginView ? 'Log In' : 'Sign Up'}
                                </button>
                            </form>
                            <button onClick={() => setIsLoginView(!isLoginView)} className="w-full text-center mt-6 text-sm text-gray-400 hover:text-white transition-colors">
                                {isLoginView ? "Don't have an account? Sign up" : "Already have an account? Log in"}
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="pb-20">
                    {/* Navbar */}
                    <nav className="border-b border-purple-900/50 bg-black/50 backdrop-blur-md sticky top-0 z-50">
                        <div className="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
                            <h1 className="text-2xl font-black bg-gradient-to-r from-purple-500 to-electric text-transparent bg-clip-text">OXY PANNEL</h1>
                            <div className="flex items-center gap-4">
                                <span className="bg-gray-800 px-3 py-1 rounded-full text-sm font-bold border border-gray-700 flex items-center gap-2">
                                    <svg className="w-4 h-4 text-purple-400" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"/><path fillRule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM4 13a1 1 0 011-1h1a1 1 0 110 2H5a1 1 0 01-1-1zm5-1a1 1 0 100 2h1a1 1 0 100-2H9z" clipRule="evenodd"/></svg>
                                    ₹{userData.balance || 0}
                                </span>
                                <button onClick={() => auth.signOut()} className="text-sm bg-red-500/10 text-red-400 px-3 py-1 rounded-full hover:bg-red-500 hover:text-white transition-colors">Logout</button>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content Area */}
                    <div className="max-w-4xl mx-auto px-4 mt-8">
                        {!isAdminMode ? (
                            <>
                                {/* Video Section */}
                                <div className="w-full aspect-video bg-gray-900 rounded-xl overflow-hidden border border-gray-800 shadow-[0_0_20px_rgba(0,0,0,0.5)] mb-6 flex items-center justify-center relative">
                                    {productData.videoUrl ? (
                                        <video className="w-full h-full object-cover" src={productData.videoUrl} controls controlsList="nodownload"></video>
                                    ) : (
                                        <div className="text-gray-500 flex flex-col items-center">
                                            <svg className="w-12 h-12 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                                            <p>Admin will upload preview video soon.</p>
                                        </div>
                                    )}
                                </div>
                                
                                <h2 className="text-3xl font-black mb-2 uppercase tracking-wide">OXY PANNEL KEY</h2>
                                <p className="text-gray-400 mb-8 whitespace-pre-line text-lg">{productData.details}</p>

                                <h3 className="text-xl font-bold mb-4 border-l-4 border-purple-500 pl-3">Select Key Duration</h3>
                                
                                {/* Purchase Cards */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10">
                                    <div className="bg-gray-900 border border-gray-800 p-6 rounded-xl text-center hover:border-purple-500 transition-colors">
                                        <h4 className="text-xl font-bold text-gray-300 mb-1">{productData.dur1}</h4>
                                        <div className="text-3xl font-black text-purple-400 mb-4">₹{productData.price1}</div>
                                        <button onClick={() => handleBuy(productData.dur1, productData.price1)} className="w-full bg-white/10 hover:bg-purple-600 py-3 rounded-lg font-bold transition-colors">Purchase Key</button>
                                    </div>
                                    <div className="bg-gray-900 border border-purple-500 p-6 rounded-xl text-center relative shadow-[0_0_15px_rgba(168,85,247,0.2)] scale-[1.02]">
                                        <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-purple-600 text-xs font-bold px-3 py-1 rounded-full">RECOMMENDED</div>
                                        <h4 className="text-xl font-bold text-gray-300 mb-1">{productData.dur2}</h4>
                                        <div className="text-3xl font-black text-purple-400 mb-4">₹{productData.price2}</div>
                                        <button onClick={() => handleBuy(productData.dur2, productData.price2)} className="w-full bg-gradient-to-r from-purple-600 to-electric py-3 rounded-lg font-bold hover:opacity-90 transition-opacity">Purchase Key</button>
                                    </div>
                                    <div className="bg-gray-900 border border-gray-800 p-6 rounded-xl text-center hover:border-purple-500 transition-colors">
                                        <h4 className="text-xl font-bold text-gray-300 mb-1">{productData.dur3}</h4>
                                        <div className="text-3xl font-black text-purple-400 mb-4">₹{productData.price3}</div>
                                        <button onClick={() => handleBuy(productData.dur3, productData.price3)} className="w-full bg-white/10 hover:bg-purple-600 py-3 rounded-lg font-bold transition-colors">Purchase Key</button>
                                    </div>
                                </div>

                                {/* Add Balance Banner */}
                                <div className="bg-gradient-to-r from-gray-900 to-black border border-gray-800 rounded-xl p-6">
                                    <h4 className="text-xl font-bold text-white mb-2 flex items-center gap-2">
                                        <svg className="w-6 h-6 text-electric" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        How to Add Balance?
                                    </h4>
                                    <p className="text-gray-400 mb-6">Send money directly to Admin via UPI/Payment App, then send the screenshot on WhatsApp or Telegram along with your registered email: <strong className="text-white">{user.email}</strong></p>
                                    
                                    <div className="flex flex-col sm:flex-row gap-4">
                                        <a href={`https://wa.me/917250019052?text=Hi Admin, I want to add balance. My OXY PANNEL Email is: ${user.email}`} target="_blank" className="flex-1 flex items-center justify-center gap-2 bg-[#25D366] hover:bg-[#128C7E] text-white px-6 py-3 rounded-lg font-bold transition-colors">
                                            <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.201.535 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824zm-3.423-14.416c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm.082 19.165s-.011.001-.033.001c-1.636-.001-3.129-.43-4.494-1.238l-4.996 1.31 1.332-4.871c-.885-1.428-1.353-3.048-1.353-4.756 0-5.068 4.122-9.191 9.189-9.191 5.066 0 9.188 4.123 9.188 9.19 0 5.068-4.122 9.191-9.188 9.191z"/></svg>
                                            Contact WhatsApp
                                        </a>
                                        <a href="https://t.me/Ts_hunter01" target="_blank" className="flex-1 flex items-center justify-center gap-2 bg-[#0088cc] hover:bg-[#0077b5] text-white px-6 py-3 rounded-lg font-bold transition-colors">
                                            <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.295-.6.295-.002 0-.003 0-.005 0l.213-3.054 5.56-5.022c.24-.213-.054-.334-.373-.121l-6.869 4.326-2.96-.924c-.64-.203-.658-.64.135-.954l11.566-4.458c.538-.196 1.006.128.832.94z"/></svg>
                                            Contact Telegram
                                        </a>
                                    </div>
                                </div>
                            </>
                        ) : (
                            /* Admin Panel View */
                            <div className="bg-gray-900 border border-purple-500/50 rounded-xl p-6 shadow-[0_0_30px_rgba(168,85,247,0.1)]">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
                                    <h2 className="text-2xl font-black text-electric uppercase">Super Admin Panel</h2>
                                    <button onClick={() => setIsAdminMode(false)} className="text-red-400 hover:text-red-300 font-bold px-4 py-2 bg-red-500/10 rounded-lg">Close Admin</button>
                                </div>
                                
                                {/* Manage Users Balance */}
                                <div className="mb-10 bg-black/50 p-6 rounded-xl border border-gray-800">
                                    <h3 className="text-xl font-bold mb-4 text-green-400">💰 Add Balance to User</h3>
                                    <form onSubmit={adminUpdateBalance} className="flex flex-col md:flex-row gap-4">
                                        <input required type="email" placeholder="Enter User's Email ID" value={adminEmail} onChange={e=>setAdminEmail(e.target.value)} className="flex-1 p-3 bg-black border border-gray-700 rounded-lg outline-none focus:border-green-500" />
                                        <input required type="number" placeholder="Amount (₹)" value={addBalanceAmount} onChange={e=>setAddBalanceAmount(e.target.value)} className="w-full md:w-32 p-3 bg-black border border-gray-700 rounded-lg outline-none focus:border-green-500" />
                                        <button type="submit" className="bg-green-600 hover:bg-green-500 py-3 px-6 rounded-lg font-bold transition-colors">Add Funds</button>
                                    </form>
                                </div>

                                {/* Update Product Details */}
                                <div className="bg-black/50 p-6 rounded-xl border border-gray-800">
                                    <h3 className="text-xl font-bold mb-4 text-purple-400">⚙️ Edit OXY PANNEL Details</h3>
                                    <form onSubmit={adminSaveProduct} className="space-y-6">
                                        
                                        {/* Direct Video Upload */}
                                        <div className="bg-gray-900 p-4 rounded-lg border border-gray-700">
                                            <label className="block text-sm text-gray-400 mb-2 font-bold">1. Upload Direct Video (MP4)</label>
                                            <input type="file" accept="video/*" onChange={handleVideoUpload} className="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700" />
                                            {uploading && <p className="text-electric text-sm mt-2 font-bold animate-pulse">Uploading video, please wait...</p>}
                                            {productData.videoUrl && <p className="text-green-400 text-xs mt-2 break-all">Current Video URL: {productData.videoUrl}</p>}
                                        </div>

                                        <div>
                                            <label className="block text-sm text-gray-400 mb-1 font-bold">2. Panel Description / Details</label>
                                            <textarea required value={productData.details} onChange={e=>setProductData({...productData, details: e.target.value})} className="w-full p-3 bg-black border border-gray-700 rounded-lg outline-none focus:border-purple-500 h-24"></textarea>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-gray-900 p-4 rounded-lg border border-gray-700">
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Key 1 Duration</label>
                                                <input required value={productData.dur1} onChange={e=>setProductData({...productData, dur1: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg mb-2 outline-none focus:border-purple-500" />
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Price (₹)</label>
                                                <input required type="number" value={productData.price1} onChange={e=>setProductData({...productData, price1: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg outline-none focus:border-purple-500" />
                                            </div>
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Key 2 Duration</label>
                                                <input required value={productData.dur2} onChange={e=>setProductData({...productData, dur2: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg mb-2 outline-none focus:border-purple-500" />
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Price (₹)</label>
                                                <input required type="number" value={productData.price2} onChange={e=>setProductData({...productData, price2: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg outline-none focus:border-purple-500" />
                                            </div>
                                            <div>
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Key 3 Duration</label>
                                                <input required value={productData.dur3} onChange={e=>setProductData({...productData, dur3: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg mb-2 outline-none focus:border-purple-500" />
                                                <label className="block text-sm text-gray-400 mb-1 font-bold">Price (₹)</label>
                                                <input required type="number" value={productData.price3} onChange={e=>setProductData({...productData, price3: e.target.value})} className="w-full p-2 bg-black border border-gray-700 rounded-lg outline-none focus:border-purple-500" />
                                            </div>
                                        </div>
                                        <button type="submit" className="w-full bg-gradient-to-r from-purple-600 to-electric py-4 rounded-lg font-black text-lg hover:opacity-90 shadow-lg transition-opacity">Save Product Changes Live</button>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Footer */}
                    <footer className="mt-20 border-t border-gray-800 py-8 text-center text-gray-500 text-sm flex flex-col items-center">
                        <p className="mb-2">© 2026 OXY PANNEL. All rights reserved.</p>
                        {!isAdminMode && (
                            <button onClick={() => {
                                const pass = prompt("Enter Admin Password:");
                                if(pass === "oxystore123") setIsAdminMode(true);
                                else if(pass) alert("Wrong Password!");
                            }} className="text-gray-600 hover:text-purple-400 cursor-pointer font-bold tracking-widest text-xs">ADMIN ACCESS</button>
                        )}
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
